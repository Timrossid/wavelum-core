name: Smart Contracts CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-contributing:
    name: Validate CONTRIBUTING.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check CONTRIBUTING.md exists
        run: |
          if [ ! -f "CONTRIBUTING.md" ]; then
            echo "ERROR: CONTRIBUTING.md not found"
            exit 1
          fi
          echo "CONTRIBUTING.md exists"

  validate-pr-title:
    name: Validate PR Title (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate Conventional Commits
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Validating PR title: $PR_TITLE"
          
          # Conventional commits pattern: type(scope): subject
          # Using grep for better compatibility
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf|ci)(\(.+\))?: .+'; then
            echo "WARNING: PR title does not follow conventional commits format"
            echo "Expected format: type(scope): subject"
            echo "Example: feat(vault): add claim function"
            exit 1
          fi
          
          echo "PR title follows conventional commits format"

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check if contracts changed
        id: check-contracts
        run: |
          if git diff --name-only origin/main...HEAD | grep -q '^contracts/'; then
            echo "contracts_changed=true" >> $GITHUB_OUTPUT
          else
            echo "contracts_changed=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install Rust
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.0
          target: wasm32v1-none
          override: true
          components: rustfmt, clippy

      - name: Install Stellar CLI
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          wget https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli-25.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli-25.1.0-x86_64-unknown-linux-gnu.tar.gz
          sudo mv stellar /usr/local/bin/
          set -euo pipefail

          VERSION="25.1.0"
          ARCHIVE="stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/${ARCHIVE}"

          wget "${URL}" -O "${ARCHIVE}"

          # Package layout has changed across versions; locate the binary from the archive contents.
          BIN_PATH="$(tar -tzf "${ARCHIVE}" | grep -E '(^|/)stellar(-cli)?$' | head -n 1 || true)"
          if [ -z "${BIN_PATH}" ]; then
            echo "Could not locate stellar CLI binary in ${ARCHIVE}"
            tar -tzf "${ARCHIVE}"
            exit 1
          fi

          tar -xzf "${ARCHIVE}"

          sudo install -m 0755 "${BIN_PATH}" /usr/local/bin/stellar
          stellar --version

      - name: Build Contract
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo clean
          cargo build --target wasm32v1-none --release

      - name: Run Formal Reentrancy Verification
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo test -p vesting_contracts formal_reentrancy -- --nocapture

      - name: Run Unit Tests
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo test --workspace
          cargo test --all-features
